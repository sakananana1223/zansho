<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>残照ファインダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --body:#CDC9C0;--plate:#E6E3DC;--ink:#1F2023;--sub:#5C5A55;--leather:#2E3033;--accent:#E0A11B;--gold:#9A6A00;--line:rgba(0,0,0,.16);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--body:#24272C;--plate:#33373D;--ink:#ECE8DF;--sub:#A9A59C;--leather:#15171A;--accent:#F0B429;--gold:#F0C35A;--line:rgba(255,255,255,.14);color-scheme:dark}
}
:root[data-theme="dark"]{--body:#24272C;--plate:#33373D;--ink:#ECE8DF;--sub:#A9A59C;--leather:#15171A;--accent:#F0B429;--gold:#F0C35A;--line:rgba(255,255,255,.14);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--body);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif;font-weight:700;font-size:17px;letter-spacing:.1em;white-space:nowrap}
.meta{display:flex;gap:12px;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px;align-items:baseline;white-space:nowrap}
.meta b{color:var(--ink);font-size:18px;font-weight:700;margin-left:3px}
#phase{font-family:"Zen Old Mincho",serif;color:var(--ink);font-size:13px}
.seg{display:flex;background:var(--plate);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--body)}
.finder{position:relative;background:var(--leather);padding:8px;border-radius:7px}
.finder canvas{display:block;width:100%;touch-action:none;border-radius:2px;background:#000}
.flash{position:absolute;inset:8px;background:#fff;opacity:0;pointer-events:none;border-radius:2px}
.flash.on{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.gridbtn{position:absolute;top:14px;right:14px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;font-size:11px;padding:3px 9px}
.gridbtn[aria-pressed="false"]{opacity:.55}
.simtag{position:absolute;top:14px;left:14px;color:#fff;font-size:11px;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:999px;pointer-events:none}
.toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,8px);background:rgba(20,20,22,.82);color:#F3EFE6;padding:7px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;max-width:92%;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font-family:"Zen Old Mincho",serif;font-size:15px}
.toast .y{color:#F5C55B;display:block;font-family:"Zen Old Mincho",serif;font-size:16px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.controls .seg{justify-self:start}
.shutter{width:76px;height:76px;border-radius:50%;border:7px solid var(--plate);background:var(--accent);box-shadow:0 2px 0 rgba(0,0,0,.2),inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .08s}
.shutter:active{transform:scale(.93)}
.shutter:disabled{filter:grayscale(1);opacity:.5}
.films{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.films::-webkit-scrollbar{display:none}
.films button{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 11px;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.films button i{width:12px;height:12px;border-radius:2px;display:inline-block}
.films button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--plate)}
.mini canvas{display:block;width:100%;aspect-ratio:3/1;border-radius:4px;touch-action:none}
.memo{font-size:12px;color:var(--sub);margin:0;min-height:1.6em;font-family:"Zen Old Mincho",serif;line-height:1.6}

.screen{position:fixed;inset:0;background:var(--body);overflow-y:auto;display:none;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.screen.show{display:block}
.start{display:flex;flex-direction:row-reverse;justify-content:center;gap:26px;max-width:520px;margin:4vh auto 0;align-items:flex-start}
.vtitle{writing-mode:vertical-rl;font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif;font-weight:700;font-size:clamp(44px,13vw,68px);letter-spacing:.18em;line-height:1;margin:0}
.vtitle span{display:block;font-size:.32em;font-weight:400;letter-spacing:.3em;color:var(--sub);margin-right:.6em;margin-top:1.4em}
.startcopy{max-width:16em;padding-top:10px;font-size:15px;line-height:1.85}
.startcopy p{margin:0 0 12px}
.primary{display:inline-block;margin-top:8px;border:0;background:var(--ink);color:var(--body);padding:14px 26px;border-radius:999px;font-size:16px;font-weight:700}
.ghost{display:inline-block;margin-top:10px;border:1px solid var(--ink);background:transparent;padding:10px 20px;border-radius:999px;font-size:14px}
.record{font-size:13px;color:var(--sub);margin-top:12px}
.res{max-width:520px;margin:0 auto}
.res h2{font-family:"Zen Old Mincho",serif;font-size:15px;font-weight:400;color:var(--sub);margin:0 0 14px;letter-spacing:.2em}
.print{background:#F7F5EF;padding:12px 12px 16px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.22);transform:rotate(-1deg);color:#1F2023}
.print img{display:block;width:100%;height:auto}
.print .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-family:"Zen Old Mincho",serif;gap:10px}
.print .cap strong{font-size:20px}
.print .cap span{font-size:28px;font-weight:700}
.print .sub{font-size:12px;color:#6b675f;margin-top:4px}
.critique{font-family:"Zen Old Mincho",serif;font-size:16px;line-height:2;margin:22px 2px 10px}
.yakus{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 16px}
.yakus span{border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:3px 8px;font-size:13px;font-family:"Zen Old Mincho",serif}
.stats{display:flex;gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 2px;margin-bottom:20px;flex-wrap:wrap}
.stats div{font-size:12px;color:var(--sub)}
.stats b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--leather);padding:12px;border-radius:4px}
.sheet figure{margin:0;color:#DAD5CB;font-size:12px}
.sheet img{display:block;width:100%;height:auto;border-radius:1px}
.sheet figcaption{margin-top:5px;line-height:1.5}
.sheet figcaption div{display:flex;justify-content:space-between;gap:6px}
.sheet figcaption .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Zen Old Mincho",serif;font-size:13px}
.sheet figcaption .t.y{color:#F5C55B}
.sheet figcaption small{color:#9E998F}
.breakdown{font-size:13px;color:var(--sub);line-height:1.9;margin:0 2px 18px}
.zk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 24px}
.zk div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:74px}
.zk b{display:block;font-family:"Zen Old Mincho",serif;font-size:16px;margin-bottom:4px}
.zk .got b{color:var(--gold)}
.zk small{color:var(--sub);font-size:12px;line-height:1.5;display:block}
.zk em{font-style:normal;float:right;color:var(--sub);font-size:12px}
.center{text-align:center}
.pt{font-variant-numeric:tabular-nums;font-weight:700}
.shop h3{font-family:"Zen Old Mincho",serif;font-size:17px;margin:26px 0 10px;font-weight:700}
.wallet{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.wallet b{font-size:28px;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item .ic{width:46px;height:46px;border-radius:8px;background:var(--plate);display:grid;place-items:center}
.item .ic i{display:block;border:2px solid var(--ink);border-radius:2px}
.item .sw{width:30px;height:30px;border-radius:4px}
.item b{font-family:"Zen Old Mincho",serif;font-size:16px}
.item small{display:block;color:var(--sub);font-size:12px;line-height:1.55;margin-top:2px}
.item button{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.item button.buy{background:var(--ink);color:var(--body)}
.item button:disabled{opacity:.35;cursor:default}
.item button.using{border-color:transparent;color:var(--gold)}
.camline{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.7}
.lensbtn{justify-self:start;border:1px solid var(--line);background:var(--plate);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3;max-width:100%}
.lensbtn small{display:block;font-size:10px;color:var(--sub)}
.lensbtn span{font-size:13px;font-weight:700;white-space:nowrap}
.focal{justify-self:end;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.focal small{font-size:12px;color:var(--sub);font-weight:400;margin-left:2px}
.zoom{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.zoom[hidden]{display:none}
.zoom input{flex:1;accent-color:var(--accent);height:28px}
@media (prefers-reduced-motion:reduce){.flash.on{animation:none}.print{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">残照ファインダー</div>
    <div class="meta"><span id="phase">午後</span><span><b id="clock">16:30</b></span><span>残り<b id="left">12</b></span></div>
  </header>
  <div class="films" id="locTabs" role="group" aria-label="撮影地"></div>
  <div class="finder">
    <canvas id="view" aria-label="ファインダー。スワイプでカメラを動かす"></canvas>
    <div class="flash" id="flash"></div>
    <div class="simtag" id="simtag">標準</div>
    <button class="gridbtn" id="gridBtn" aria-pressed="true">三分割</button>
    <div class="toast" id="toast"></div>
  </div>
  <div class="controls">
    <button class="lensbtn" id="lensBtn" aria-label="レンズを交換"><small>レンズ交換</small><span id="lensName">50mm F1.8</span></button>
    <button class="shutter" id="shutter" aria-label="シャッターを切る"></button>
    <div class="focal" id="focal">50<small>mm</small></div>
  </div>
  <div class="zoom" id="zoomRow" hidden><span id="zMin">24</span><input type="range" id="zoom" min="24" max="70" step="1" aria-label="ズーム"><span id="zMax">70</span></div>
  <div class="films" id="films" role="group" aria-label="フィルム"></div>
  <div class="mini"><canvas id="mini" aria-label="全景。タップでその場所へ"></canvas></div>
  <p class="memo" id="memo"></p>
</div>

<section class="screen show" id="startScreen">
  <div class="start">
    <h1 class="vtitle">残照<span>ファインダー</span></h1>
    <div class="startcopy">
      <p>夕方から夜までの4分間、日本の撮影地で光を追う。</p>
      <p>被写体の組み合わせで「役」がそろうと、写真に名前と得点がつく。ポイントを貯めて、カメラやレンズ、新しい撮影地への旅を手に入れよう。</p>
      <div class="camline" id="camline"></div>
      <button class="primary" id="startBtn">撮影をはじめる</button><br>
      <button class="ghost" data-shop>カメラ店</button>
      <button class="ghost" data-travel>旅行代理店</button>
      <button class="ghost" data-zukan>役図鑑</button>
      <div class="record" id="record"></div>
    </div>
  </div>
</section>
<section class="screen" id="resScreen"><div class="res" id="res"></div></section>
<section class="screen" id="zkScreen"><div class="res" id="zk"></div></section>
<section class="screen" id="travelScreen"><div class="res shop" id="travel"></div></section>
<section class="screen" id="shopScreen"><div class="res shop" id="shop"></div></section>

<script>
(()=>{const W=3000,H=1000,DUR=240;let SHOTS=12;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#view'),ctx=cv.getContext('2d');
const mini=$('#mini'),mctx=mini.getContext('2d');
const photo=document.createElement('canvas');photo.width=600;photo.height=400;const pctx=photo.getContext('2d');
const fw=mm=>1200*Math.pow(24/mm,.8);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const HX={};const hex=h=>HX[h]||(HX[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const gs=(x,c,w)=>Math.exp(-(((x-c)/w)**2));
const NIGHT=[10,13,26],WHITE=[255,255,255];
let S0=null;
const col=(h,s,k=.92)=>rgb(mix(hex(h),NIGHT,s.dark*k));
const colw=(h,s,k=.92,w=.35)=>rgb(mix(mix(hex(h),s.sc,s.gold*w),NIGHT,s.dark*k));
const cola=(h,s,a,k=.92)=>rgb(mix(hex(h),NIGHT,s.dark*k),a);
let sd=11;const R=()=>{sd=(sd*16807)%2147483647;return(sd-1)/2147483646};
const rr=Math.random;
const hs=(a,b=0)=>{const v=Math.sin(a*12.9898+b*78.233)*43758.5453;return v-Math.floor(v)};
const on=(s,t0,dt=.03)=>clamp((s.t-t0)/dt);
let el=0,playing=false,shots=[],frame=0,lastT=0,grid=true,locId='enoshima',simId='std',ev={},LQ=false;
let camW=720,camH=480;const cams={};
const SKY=[[0,'#4A7FB5','#BCD6E8'],[.33,'#5D82AC','#F0D6A2'],[.48,'#6A5C8F','#F79A55'],[.6,'#3D3F74','#E3786A'],[.72,'#1E2C5E','#5A6CA6'],[.86,'#0D1430','#22335E'],[1,'#05081A','#0D1530']].map(k=>[k[0],hex(k[1]),hex(k[2])]);
function sky(t){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return[mix(a[1],b[1],k),mix(a[2],b[2],k)]}}const l=SKY[SKY.length-1];return[l[1],l[2]]}
const timeWord=t=>t<.33?'午後':t<.55?'黄金の刻':t<.66?'残照':t<.82?'青の時間':'宵闇';
const clockOf=t=>{const m=16*60+30+Math.floor(t*195);return`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
const STAGES={};
function state(){const t=el/DUR,[sT,sB]=sky(t),St=STAGES[locId];return{t,sT,sB,dark:clamp((t-.3)/.42),sc:mix(hex('#FFF5D9'),hex('#FF7330'),clamp((t-.15)/.4)),sp:St.sun(t),gold:gs(t,.47,.09),night:clamp((t-.62)/.15),hz:St.hz}}

// ---------- shared scenery ----------
function ridge(hz,amp,sdd,fs,env,step=15){const p=[];for(let x=0;x<=W;x+=step){let y=0;fs.forEach((f,i)=>y+=Math.sin(x*f+sdd*(i+1)*1.7)/(i+1));p.push([x,hz-amp*Math.max(0,env(x))*(0.55+0.45*y/1.84)])}return p}
const ridgeY=(pts,x)=>{const st=pts[1][0]-pts[0][0],i=clamp(Math.floor(x/st),0,pts.length-2),k=(x-pts[i][0])/st;return pts[i][1]+(pts[i+1][1]-pts[i][1])*k};
function fuji(cx,sy,half,hz){const pts=[];for(let x=cx-half;x<=cx+half;x+=8){const u=Math.abs(x-cx)/half;let y=hz-(hz-sy)*Math.pow(1-u,1.6);if(Math.abs(x-cx)<half*.035)y=sy+3+Math.sin(x*.6)*2;pts.push([x,y])}return{cx,sy,half,hz,pts,y:x=>{const u=Math.abs(x-cx)/half;return u>=1?hz:hz-(hz-sy)*Math.pow(1-u,1.6)}}}
const STARS=[...Array(260)].map(()=>[R()*W,R()*620,R()*1.6+.4,R()*6]);
const MILKY=[...Array(500)].map(()=>{const u=R();return[200+u*2600,60+u*380+(R()-.5)*120*(1-Math.abs(u-.5)),R()*1.3+.3,R()*6]});
const RIP=[...Array(140)].map(()=>[R()*W,Math.pow(R(),1.4),30+R()*170,R()*6]);
const GLIT=[...Array(160)].map(()=>[(R()-.5),Math.pow(R(),.8),R()*6]);
const CLOUDS=[...Array(10)].map((_,i)=>({x:i*330+R()*200,y:90+R()*260,v:3+R()*5,sc:.7+R()*.7,parts:[...Array(6)].map(()=>[(R()-.5)*260,(R()-.5)*34,30+R()*48])}));

function glow(c,x,y,r,cl,a){if(a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb(cl,a));g.addColorStop(.35,rgb(cl,a*.35));g.addColorStop(1,rgb(cl,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function drawSky(c,s,o={}){
  const hz=o.hz||s.hz,t=s.t;
  let gr=c.createLinearGradient(0,0,0,hz);gr.addColorStop(0,rgb(s.sT));gr.addColorStop(.75,rgb(mix(s.sT,s.sB,.7)));gr.addColorStop(1,rgb(s.sB));c.fillStyle=gr;c.fillRect(0,0,W,hz+2);
  const sa=clamp((t-.66)/.16)*(o.stars||1);
  if(sa>0&&!LQ){c.fillStyle='#fff';for(const st of STARS){if(st[1]>hz-20)continue;c.globalAlpha=sa*(.45+.55*Math.sin(el*1.5+st[3]));c.fillRect(st[0],st[1],st[2],st[2])}
    if(o.milky){const ma=clamp((t-.8)/.12)*o.milky;if(ma>0){c.save();c.globalCompositeOperation='lighter';const g=c.createLinearGradient(200,500,2800,60);g.addColorStop(0,'rgba(150,160,220,0)');g.addColorStop(.5,`rgba(170,170,230,${.12*ma})`);g.addColorStop(1,'rgba(150,160,220,0)');c.fillStyle=g;c.beginPath();c.moveTo(200,380);c.lineTo(2800,-40);c.lineTo(2800,160);c.lineTo(200,600);c.fill();c.fillStyle='#fff';for(const m of MILKY){c.globalAlpha=ma*(.3+.4*Math.sin(el+m[3]));c.fillRect(m[0],m[1],m[2],m[2])}c.restore()}}
    c.globalAlpha=1}
  const sh=starNow(locId);if(sh){const g=c.createLinearGradient(sh.x-220,sh.y-80,sh.x,sh.y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,`rgba(255,255,240,${Math.sin(sh.p*Math.PI)})`);c.strokeStyle=g;c.lineWidth=3;c.beginPath();c.moveTo(sh.x-220,sh.y-80);c.lineTo(sh.x,sh.y);c.stroke();glow(c,sh.x,sh.y,14,WHITE,.9)}
  c.save();c.beginPath();c.rect(0,0,W,hz);c.clip();
  const sp=s.sp;

  const parts={comp:Math.min(1,main?main.sc:0)*30,light:light*25,hor:hor*15,mom:Math.min(20,mom*20*(camId==='hayate'?1.25:1)),simp:simp*10};
  let base=Math.round(Object.values(parts).reduce((a,b)=>a+b,0));
  let camBonus=0;if(camId==='ginrei')camBonus=5;if(camId==='pop'&&['人','猫','犬','子ども'].some(k=>tags.has(k)))camBonus=5;if(LENS().min===LENS().max)camBonus+=3;
  const sim=SIMS.find(x=>x.id===simId),filmOk=!!(sim.good&&sim.good(t,tags));
  const x={has:k=>tags.has(k),t};let yk=YAKU.filter(y=>y.f(x));const over=new Set(yk.flatMap(y=>y.over||[]));yk=yk.filter(y=>!over.has(y.id)).sort((a,b)=>b.p-a.p);
  const ypts=yk.reduce((a,y)=>a+y.p,0);
  const score=base+camBonus+(filmOk?6:0)+ypts;
  const tw=timeWord(t);let title;
  if(yk.length)title=yk[0].n;
  else if(main){const sec=vis.find(v=>v!==main&&v.n!==main.n&&v.n!=='逆さ富士'&&v.sc>.2);title=sec?`${main.n}と${sec.n}`:`${tw}の${main.n}`}
  else title=`${tw}の余白`;
  return{score,base,parts,title,yaku:yk.map(y=>({id:y.id,n:y.n,p:y.p})),film:sim.n,filmOk,filmWhy:sim.why,hasMain:!!main,subjTiming:subjL,mainName:main?main.n:'',loc:L.name,clock:clockOf(t),cam:CAM().n,lens:LENS().short,camBonus};
}
const MAX={comp:30,light:25,hor:15,mom:20,simp:10};
const GOOD={comp:'主役が三分割の交点にぴたりと座っている。',light:'光の選び方がいい。この時刻にしか撮れない色だ。',hor:'水平線の置き方に迷いがない。',mom:'動くものの一瞬を止めた。シャッターの勘が冴えている。',simp:'要素を絞った潔い画面。'};
function critique(r){
  const ks=Object.keys(MAX),nm=k=>r.parts[k]/MAX[k];const best=ks.slice().sort((a,b)=>nm(b)-nm(a))[0],worst=ks.slice().sort((a,b)=>nm(a)-nm(b))[0];
  const BAD={comp:r.hasMain?'主役を交点へもう少し寄せると、画面に緊張が生まれる。':'主役が見当たらない。何を撮りたかったのか、まず決めたい。',light:r.mainName?`${r.mainName}には、もっと似合う時刻がある。`:'光がまだ平板だ。',hor:'水平線が画面を真っ二つに割っている。上か下の三分の一へ。',mom:'動くものを入れると、写真に時間が流れ出す。',simp:r.hasMain?'要素が多く、視線が迷う。':'画面が空っぽだ。'};
  let s='';if(r.yaku.length)s+=`「${r.yaku[0].n}」がそろった。`;if(r.subjTiming>.8)s+=`${r.mainName}が一番美しい時刻を逃さなかった。`;
  s+=(nm(best)>.6?GOOD[best]:'')+(nm(worst)<.85?BAD[worst]:'非の打ちどころがない。');
  if(r.filmOk)s+=`${r.film}のフィルムが${r.filmWhy}によく合っている。`;
  return s;
}

let drag=null;const pts=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mm:fmm};drag=null}else drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(LENS().min!==LENS().max)setFocal(pinch.mm*d/pinch.d);return}
  if(!drag)return;const k=camW/cv.clientWidth,c=cams[locId];c.x-=(e.clientX-drag.x)*k;c.y-=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};clampCam()});

let toastT;

  $('#travel').innerHTML=`<h2>旅行代理店</h2><div class="wallet"><span>所持ポイント</span><b>${pt} pt</b></div><p class="breakdown" style="margin-top:12px">撮影旅行のチケットを買うと、その撮影地に行けるようになる。</p>${Object.entries(STAGES).map(([k,st])=>`<div class="item"><div class="ic"><span class="sw" style="background:${st.sw||'#888'}"></span></div><div><b>${esc(st.name)}</b><small>${esc(st.blurb)}</small></div>${own.includes(k)?'<button class="using" disabled>行ける</button>':`<button class="buy" data-buytrip="${k}" ${pt<st.price?'disabled':''}>${st.price} pt</button>`}</div>`).join('')}<p class="center" style="margin-top:24px"><button class="primary" id="travelBack">戻る</button></p>`;

function shop(from){if(from)shopBack=from;const pt=store.get('zansho-pt',0),own=owned();
  const camIc=c=>{const w=c.aspect>2?30:c.aspect===1?20:26,h=Math.round(w/c.aspect);return`<div class="ic"><i style="width:${w}px;height:${h}px"></i></div>`};
  const camBtn=c=>c.id===camId?'<button class="using" disabled>使用中</button>':own.cams.includes(c.id)?`<button data-use="${c.id}">使う</button>`:`<button class="buy" data-buycam="${c.id}" ${pt<c.price?'disabled':''}>${c.price} pt</button>`;

  const filmBtn=f=>own.films.includes(f.id)?'<button class="using" disabled>所持</button>':`<button class="buy" data-buyfilm="${f.id}" ${pt<f.price?'disabled':''}>${f.price} pt</button>`;
  $('#shop').innerHTML=`<h2>カメラ店</h2><div class="wallet"><span>所持ポイント</span><b>${pt} pt</b></div>

function finish(){
  playing=false;const res=$('#res');
  if(!shots.length){res.innerHTML=`<h2>現像</h2><p class="critique">日が暮れた。一枚も撮らなかった。光は待ってくれない。</p><button class="primary" id="again">もう一度撮る</button>`}
  else{
    const best=shots.reduce((a,b)=>b.score>a.score?b:a),avg=Math.round(shots.reduce((a,b)=>a+b.score,0)/shots.length);
    const rank=avg>=105?'巨匠':avg>=85?'写真家':avg>=68?'有望な新人':avg>=50?'散歩カメラマン':'シャッター初心者';
    const prev=store.get('zansho-best',0);if(avg>prev)store.set('zansho-best',avg);
    const earned=shots.reduce((a,b)=>a+b.score,0),wallet=store.get('zansho-pt',0)+earned;store.set('zansho-pt',wallet);
    const allY=[...new Set(shots.flatMap(s=>s.yaku.map(y=>y.n)))],fresh=shots.flatMap(s=>s.fresh);const p=best.parts;
    res.innerHTML=`<h2>現像</h2>
    <div class="print"><img src="${best.img}" alt="${esc(best.title)}"><div class="cap"><strong>「${esc(best.title)}」</strong><span>${best.score}</span></div><div class="sub">${esc(best.loc)}、${best.clock}、${esc(best.cam)}、${esc(best.lens)}、${esc(best.film)}</div></div>
    <p class="critique">${esc(critique(best))}</p>
    <p class="breakdown">構図 ${Math.round(p.comp)}/30、光 ${Math.round(p.light)}/25、水平線 ${Math.round(p.hor)}/15、瞬間 ${Math.round(p.mom)}/20、簡潔さ ${Math.round(p.simp)}/10${best.camBonus?`、機材 +${best.camBonus}`:''}${best.filmOk?'、フィルム +6':''}${best.yaku.length?`、役 +${best.yaku.reduce((a,y)=>a+y.p,0)}`:''}</p>
    ${allY.length?`<div class="yakus">${allY.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}
    <div class="stats"><div>称号<b>${rank}</b></div><div>平均点<b>${avg}</b></div><div>そろえた役<b>${allY.length}</b></div><div>獲得<b>+${earned} pt</b></div></div>
    <p class="breakdown">所持ポイントは ${wallet} pt。カメラ店で新しいカメラやフィルムと交換できる。</p>
    ${fresh.length?`<p class="breakdown">新しい役を${fresh.length}つ図鑑に登録した。</p>`:''}${avg>prev&&prev?'<p class="breakdown">自己ベストを更新した。</p>':''}
    <div class="sheet">${shots.map(s=>`<figure><img src="${s.img}" alt="${esc(s.title)}"><figcaption><div><span class="t${s.yaku.length?' y':''}">${esc(s.title)}</span><span>${s.score}</span></div><small>${esc(s.loc)}、${s.clock}、${esc(s.cam)}、${esc(s.lens)}、${esc(s.film)}</small></figcaption></figure>`).join('')}</div>
    <p class="center" style="margin-top:24px"><button class="primary" id="again">もう一度撮る</button><br><button class="ghost" data-shop>カメラ店</button> <button class="ghost" data-travel>旅行代理店</button> <button class="ghost" data-zukan>役図鑑</button></p>`;
  }
  $$('.screen').forEach(s=>s.classList.remove('show'));$('#resScreen').classList.add('show');$('#resScreen').scrollTop=0;$('#again').onclick=start;
}
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
  if(playing){el+=dt;if(el>=DUR){el=DUR;playing=false;$('#shutter').disabled=true;toast('<b>日が暮れた</b>');setTimeout(finish,1500)}}
  const s=state();$('#clock').textContent=clockOf(s.t);$('#phase').textContent=timeWord(s.t);
  if(cv.width)renderView(ctx,cv.width,cv.height,grid,s);
  if(frame++%3===0&&mini.width)renderMini(s);
  requestAnimationFrame(loop);
}

Object.keys(STAGES).forEach(k=>cams[k]={...STAGES[k].cam0});buildTabs();buildFilms();newGame();resize();setLensId(lensId);showRecord();showMemo();requestAnimationFrame(loop);
